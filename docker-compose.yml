services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: journale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./base.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init-verify.sql:/docker-entrypoint-initdb.d/02-verify.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journale"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/journale
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  db-data: