<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Connexion administrateur et utilisateur a 24h Mada.">
  <meta property="og:title" content="Connexion - 24h Mada">
  <meta property="og:description" content="Connectez-vous pour acceder aux articles et outils admin.">
  <meta property="og:image" content="/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000000">
  <title>Connexion - 24h Mada</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 25%, #3a3a3a 50%, #2d2d2d 75%, #1a1a1a 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Animation du dégradé noir et blanc */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Effet de grain/texture */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');
      pointer-events: none;
      opacity: 0.3;
    }

    /* Carte avec effet glassmorphism noir/blanc */
    .login-card {
      background: rgba(10, 10, 10, 0.35);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.6s ease-out;
    }

    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 35px 60px -15px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Titre avec dégradé gris */
    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #ffffff, #a0a0a0, #e0e0e0, #707070);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 4s ease infinite;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Sous-titre */
    .sub {
      text-align: center;
      color: rgba(220, 220, 220, 0.85);
      font-size: 14px;
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* Champs de formulaire */
    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
      color: #ffffff;
    }

    input::placeholder {
      color: rgba(160, 160, 160, 0.6);
    }

    input:focus {
      outline: none;
      background: rgba(30, 30, 30, 0.95);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
      transform: scale(1.01);
    }

    /* Bouton monochrome avec dégradé */
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:hover::before {
      width: 300px;
      height: 300px;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3a3a3a, #252525);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* Zone de résultat */
    #result {
      margin-top: 20px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    /* Animation de chargement */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Style pour autocomplete */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px #1a1a1a inset;
      -webkit-text-fill-color: white;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .login-card {
        padding: 32px 24px;
        margin: 16px;
      }
      
      button {
        padding: 12px;
      }
      
      input {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>24h Mada</h1>
    <p class="sub">Connectez-vous pour accéder à votre espace</p>

    <form id="login">
      <div class="field">
        <label for="email">Adresse email</label>
        <input 
          id="email" 
          type="email" 
          required 
          placeholder="exemple@24hmada.com"
          autocomplete="email"
        />
      </div>
      <div class="field">
        <label for="motDePasse">Mot de passe</label>
        <input 
          id="motDePasse" 
          type="password" 
          required 
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>
      <button type="submit">Se connecter</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    // Remplissage automatique pour le développement
    document.getElementById('email').value = 'toky@gmail.com';
    document.getElementById('motDePasse').value = '123';

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const motDePasse = document.getElementById('motDePasse').value;
      const resultDiv = document.getElementById('result');
      
      resultDiv.textContent = '⏳ Connexion en cours...';
      resultDiv.style.animation = 'pulse 1s infinite';
      
      try {
        const basicAuth = 'Basic ' + btoa(email + ':' + motDePasse);
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, motDePasse })
        });
        
        if (!resp.ok) {
          const txt = await resp.text();
          resultDiv.style.animation = '';
          resultDiv.textContent = '❌ ' + txt;
          return;
        }
        
        localStorage.setItem('adminBasicAuth', basicAuth);
        resultDiv.textContent = '✅ Connexion réussie ! Redirection...';
        resultDiv.style.animation = '';
        
        setTimeout(() => {
          window.location.href = '/articles';
        }, 1000);
        
      } catch (err) {
        resultDiv.style.animation = '';
        resultDiv.textContent = '⚠️ Erreur réseau: ' + err.message;
      }
    });
  </script>
</body>
</html>
