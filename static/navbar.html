  .navbar-settings {

  /* Ensure the hamburger button keeps its intended size even when page-global button styles exist */

    padding: 0 !important;

    height: 36px !important;
    min-width: 36px !important;
    min-height: 36px !important;

  }

  .navbar-settings::after {
    content: '';
    position: absolute;
    inset: -24px;

    opacity: 0;
    transition: opacity 0.22s ease;
    pointer-events: none;
  }

  .navbar-settings-icon {

    height: 18px;
    transition: transform 0.4s ease;
  }

  .navbar .navbar-settings .navbar-settings-icon {
    width: 18px !important;
    height: 18px !important;
    display: block !important;
  }

  .navbar-settings:hover {
    border-color: rgba(255,255,255,0.5);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 9px 18px rgba(0,0,0,0.42);
  }

  .navbar-settings:hover::after {
    opacity: 1;
  }

  .navbar-settings:hover .navbar-settings-icon {
    transform: rotate(44deg);
  }

  .navbar-settings:active {
    transform: translateY(0);
  }

  .navbar-settings:focus-visible {
    outline: none;
    border-color: #aaaaaa;
    box-shadow: 0 0 0 3px rgba(150,150,150,0.3), inset 0 1px 0 rgba(255,255,255,0.15);

  .navbar-settings.active {

    border-color: rgba(255,255,255,0.6);
    color: #fff;
    box-shadow: 0 0 0 2px rgba(100,100,100,0.35);

  .navbar-settings.active .navbar-settings-icon {

    border: 1px solid rgba(255,255,255,0.12);

    font-family: 'Oswald', sans-serif;

  #navbarReset:hover {

  .chip:hover {

  .chip.active {

  /* Vertical category list inside admin sidebar */
  .admin-sidebar-section .chips-group {

    .navbar,

      transition: none;

</style>

<script>
  // Gestion de l'affichage de la sidebar
  const settingsBtn = document.getElementById('navbarSettingsBtn');
  const sidebar = document.getElementById('adminSidebar');
  const overlay = document.getElementById('adminSidebarOverlay');
  const closeBtn = document.getElementById('adminSidebarClose');

  function openSidebar() {
    sidebar.style.display = 'block';
    overlay.style.display = 'block';
    sidebar.classList.add('open');
    document.body.style.overflow = 'hidden'; // Empêche le scroll
    settingsBtn?.classList.add('active');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebar.style.display = 'none';
    overlay.style.display = 'none';
    document.body.style.overflow = ''; // Réactive le scroll
    settingsBtn?.classList.remove('active');
  }

  // Bouton d'administration
  if (settingsBtn) {
    settingsBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      console.log('Bouton cliqué'); // Pour debug
      openSidebar();
    });
  }

  // Bouton fermer
  if (closeBtn) {
    closeBtn.addEventListener('click', closeSidebar);
  }

  // Overlay (fond flou)
  if (overlay) {
    overlay.addEventListener('click', closeSidebar);
  }

  // Afficher le bouton admin (si caché)
  if (settingsBtn && settingsBtn.style.display === 'none') {
    settingsBtn.style.display = 'inline-flex';
  }

  // Logout button
  const logoutBtn = document.getElementById('adminLogoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      // Clear client-side admin auth
      try { localStorage.removeItem('adminBasicAuth'); } catch (err) {}
      // Optionally notify server (best-effort)
      try { await fetch('/api/admin/logout', { method: 'POST' }); } catch (_) {}
      closeSidebar();
      // Redirect to login page
      window.location.href = '/login.html';
    });
  }
</script>
