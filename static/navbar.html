  }

  .navbar-settings::after {

    inset: -24px;
    background: radial-gradient(circle, rgba(164,14,19,0.3), rgba(164,14,19,0));

    transform: rotate(44deg);
  }

  .navbar-settings:active {
    transform: translateY(0);
  }

  .navbar-settings:focus-visible {

    border-color: #fca5a5;
    box-shadow: 0 0 0 3px rgba(164,14,19,0.45), inset 0 1px 0 rgba(255,255,255,0.26), 0 9px 18px rgba(0,0,0,0.42);
  }

  .navbar-settings.active {
