<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Detail d'un article 24h Mada.">
  <meta property="og:title" content="Detail article - 24h Mada">
  <meta property="og:description" content="Detail d'un article 24h Mada.">
  <meta property="og:image" content="">
  <meta property="og:type" content="article">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0b57d0">
  <title>Detail article</title>
  <link rel="stylesheet" href="css/article.css">
</head>
<body>

  <!-- Contenu principal avec padding-top pour éviter d'être caché sous la navbar -->
  <div class="main-content">
    <div class="wrap">
      <div class="article-header">
        <a href="/articles" class="back-link">Retour à la liste</a>
      </div>
      <div class="article-content">
        <h1 id="titre">Chargement...</h1>
        <p id="chapeau" class="chapeau"></p>
        <div id="imageContainer" class="article-image" style="display:none">
          <img id="image" alt="Illustration de l'article" />
        </div>
        <div class="metadata-section">
          <div class="meta-item">
            <span class="meta-label">Slug</span>
            <span id="slug" class="meta-value">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Catégorie ID</span>
            <span id="categoryId" class="meta-value">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Auteur ID</span>
            <span id="authorId" class="meta-value">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Créé le</span>
            <span id="createdAt" class="meta-value">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Mis à jour le</span>
            <span id="updatedAt" class="meta-value">—</span>
          </div>
        </div>
        <div class="content-section">
          <h3>Contenu</h3>
          <div id="contenu" class="article-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getSlugFromPath() {
      const path = window.location.pathname;
      const prefix = '/articles/';
      if (!path.startsWith(prefix) || path.length <= prefix.length) {
        return null;
      }
      return decodeURIComponent(path.substring(prefix.length));
    }

    function setMeta(selector, content) {
      const el = document.querySelector(selector);
      if (el) {
        el.setAttribute('content', content || '');
      }
    }

    function updateSeo(a) {
      const titre = a.titre || 'Sans titre';
      const chapeau = a.chapeau || 'Article 24h Mada';
      document.title = titre + ' - 24h Mada';
      setMeta('meta[name="description"]', chapeau);
      setMeta('meta[property="og:title"]', titre);
      setMeta('meta[property="og:description"]', chapeau);
      setMeta('meta[property="og:url"]', window.location.href);
      if (a.imageUrl) {
        setMeta('meta[property="og:image"]', a.imageUrl);
      }
    }

    async function loadArticle() {
      const slug = getSlugFromPath();
      if (!slug) {
        document.getElementById('titre').textContent = 'Article introuvable (slug manquant)';
        document.getElementById('titre').className = 'error-message';
        return;
      }

      try {
        const resp = await fetch('/api/articles/' + encodeURIComponent(slug));
        if (!resp.ok) {
          const txt = await resp.text();
          document.getElementById('titre').textContent = 'Erreur: ' + txt;
          document.getElementById('titre').className = 'error-message';
          return;
        }

        const a = await resp.json();
        updateSeo(a);
        
        // Mise à jour des éléments avec animation
        document.getElementById('titre').textContent = a.titre || 'Sans titre';
        document.getElementById('chapeau').textContent = a.chapeau || '';
        document.getElementById('slug').textContent = a.slug || '—';
        document.getElementById('categoryId').textContent = a.categoryId ?? '—';
        document.getElementById('authorId').textContent = a.authorId ?? '—';
        
        // Formatage des dates si présentes
        if (a.createdAt) {
          const date = new Date(a.createdAt);
          document.getElementById('createdAt').textContent = date.toLocaleDateString('fr-FR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } else {
          document.getElementById('createdAt').textContent = '—';
        }
        
        if (a.updatedAt) {
          const date = new Date(a.updatedAt);
          document.getElementById('updatedAt').textContent = date.toLocaleDateString('fr-FR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } else {
          document.getElementById('updatedAt').textContent = '—';
        }
        
        document.getElementById('contenu').textContent = a.contenu || 'Aucun contenu disponible.';

        const imageContainer = document.getElementById('imageContainer');
        const img = document.getElementById('image');
        if (a.imageUrl) {
          img.src = a.imageUrl;
          img.alt = a.titre || 'Sans titre';
          imageContainer.style.display = 'block';
        } else {
          imageContainer.style.display = 'none';
        }
      } catch (err) {
        document.getElementById('titre').textContent = 'Erreur réseau: ' + err.message;
        document.getElementById('titre').className = 'error-message';
      }
    }

    loadArticle();
  </script>
  <script src="/load-navbar.min.js"></script>
</body>
</html>
