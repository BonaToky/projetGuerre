<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CRUD admin des articles.">
  <title>CURD Article</title>
  <link rel="stylesheet" href="css/curdarticle.css">
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>CURD Article (Admin)</h1>
      <p class="sub">Créer et modifier des articles. Accès protégé côté serveur (admin uniquement).</p>
      <div class="top-actions">
        <button type="button" onclick="if(window.history.length>1){window.history.back();}else{location.href='/admin';}">Retour</button>
        <button type="button" onclick="location.href='/crudarticle_tags'">Aller vers CRUD Article Tags</button>
        <button type="button" onclick="location.href='/articles'">Retour Articles</button>
      </div>

      <div class="grid">
        <div class="field"><label for="articleId">ID article (pour modifier)</label><input id="articleId" type="number" placeholder="Ex: 3"></div>
        <div class="field"><label for="slug">Slug</label><input id="slug" type="text" placeholder="mon-article"></div>

        <div class="field full"><label for="titre">Titre</label><input id="titre" type="text" placeholder="Titre de l'article" required></div>
        <div class="field full"><label for="chapeau">Chapeau</label><textarea id="chapeau" placeholder="Résumé court"></textarea></div>
        <div class="field full"><label for="contenu">Contenu</label><textarea id="contenu" placeholder="Contenu complet"></textarea></div>

        <div class="field">
          <label for="categoryId">Catégorie</label>
          <select id="categoryId"><option value="">-- sélectionner --</option></select>
        </div>
        <div class="field"><label for="authorId">Author ID</label><input id="authorId" type="number" value="1"></div>

        <div class="field full"><label for="tagSlugs">Tags (slugs, séparés par virgule)</label><input id="tagSlugs" type="text" placeholder="iran,frappes,analyse"></div>

        <div class="field full">
          <label for="imageUrl">Image URL</label>
          <input id="imageUrl" type="text" placeholder="/uploads/xxx.jpg ou https://...">
          <div class="small">Tu peux uploader un fichier image ci-dessous.</div>
        </div>

        <div class="field full"><label for="imageFile">Uploader une image</label><input id="imageFile" type="file" accept="image/*"></div>
      </div>

      <div class="actions">
        <button id="createBtn" class="primary" type="button">Créer article</button>
        <button id="updateBtn" class="primary" type="button" style="display:none">Modifier article</button>
        <button id="cancelEditBtn" type="button" style="display:none">Annuler modification</button>
        <button id="refreshBtn" type="button">Rafraîchir la liste</button>
      </div>
      <div id="msg" class="msg"></div>
    </section>

    <section class="panel">
      <h2>Articles existants</h2>
      <div id="list" class="list"></div>
    </section>
  </div>

  <script src="/load-navbar.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let isEditMode = false;
    function show(msg, isError=false){ const el=$('msg'); el.textContent=msg; el.style.color=isError?'#b91c1c':'#4b5563'; }

    function clearForm(){
      $('articleId').value='';
      $('titre').value='';
      $('chapeau').value='';
      $('slug').value='';
      $('contenu').value='';
      $('imageUrl').value='';
      $('imageFile').value='';
      $('tagSlugs').value='';
    }

    function setEditMode(active){
      isEditMode = active;
      $('createBtn').style.display = active ? 'none' : '';
      $('updateBtn').style.display = active ? '' : 'none';
      $('cancelEditBtn').style.display = active ? '' : 'none';
    }

    async function responseError(resp){
      const body = (await resp.text()).trim();
      return body || ('HTTP ' + resp.status + ' ' + resp.statusText);
    }

    async function loadMeta(){
      const resp = await fetch('/api/admin/meta');
      if(!resp.ok){ throw new Error(await resp.text()); }
      const meta = await resp.json();
      const select = $('categoryId');
      const current = select.value;
      select.innerHTML = '<option value="">-- sélectionner --</option>';
      (meta.categories||[]).forEach(c=>{
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nom + ' (' + c.slug + ')';
        select.appendChild(opt);
      });
      if(current) select.value = current;
    }

    function getPayload(){
      const tagSlugs = $('tagSlugs').value.split(',').map(s=>s.trim()).filter(Boolean);
      return {
        titre:$('titre').value,
        chapeau:$('chapeau').value,
        slug:$('slug').value,
        contenu:$('contenu').value,
        imageUrl:$('imageUrl').value,
        categoryId:$('categoryId').value?Number($('categoryId').value):null,
        authorId:$('authorId').value?Number($('authorId').value):null,
        tagSlugs
      };
    }

    async function ensureImageUploadedIfSelected(){
      const file = $('imageFile').files[0];
      if(!file){
        return;
      }
      const dataBase64 = await new Promise((resolve,reject)=>{
        const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
      });
      const resp = await fetch('/api/articles/upload', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({filename:file.name,dataBase64})
      });
      if(!resp.ok){
        throw new Error(await responseError(resp));
      }
      const data = await resp.json();
      $('imageUrl').value = data.url || '';
      $('imageFile').value = '';
      show('Image uploadée automatiquement: ' + (data.url || ''));
    }

    async function createArticle(){
      await ensureImageUploadedIfSelected();
      const resp=await fetch('/api/articles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(getPayload())});
      if(!resp.ok) throw new Error(await responseError(resp));
      const data=await resp.json();
      $('articleId').value=data.id||'';
      show('Article créé avec ID '+data.id);
      setEditMode(true);
      await loadArticles();
    }

    async function updateArticle(){
      const id=$('articleId').value;
      if(!id){ show('Renseigne article ID pour modifier.',true); return; }
      await ensureImageUploadedIfSelected();
      const resp=await fetch('/api/articles?id='+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(getPayload())});
      if(!resp.ok) throw new Error(await responseError(resp));
      const data=await resp.json();
      show('Article modifié: '+(data.slug||data.id));
      await loadArticles();
    }

    function fillForm(a){
      $('articleId').value=a.id??'';
      $('titre').value=a.titre||'';
      $('chapeau').value=a.chapeau||'';
      $('slug').value=a.slug||'';
      $('contenu').value=a.contenu||'';
      $('imageUrl').value=a.imageUrl||'';
      $('categoryId').value=a.categoryId??'';
      $('authorId').value=a.authorId??'';
      $('tagSlugs').value=Array.isArray(a.tags)?a.tags.map(t=>t.slug).filter(Boolean).join(','):'';
      setEditMode(true);
      show('Mode modification activé pour l\'article ID ' + (a.id ?? '')); 
      window.scrollTo({top:0,behavior:'smooth'});
    }

    async function loadArticles(){
      const list=$('list');
      const resp=await fetch('/api/articles');
      if(!resp.ok){ list.innerHTML='<div class="item"><span>Erreur chargement articles.</span></div>'; return; }
      const articles=await resp.json();
      if(!articles||!articles.length){ list.innerHTML='<div class="item"><span>Aucun article.</span></div>'; return; }
      list.innerHTML='';
      articles.forEach(a=>{
        const el=document.createElement('div');
        el.className='item';
        el.innerHTML=`<div><b>${a.titre||'Sans titre'}</b><span>${a.slug||''}</span></div><button type="button">Éditer</button>`;
        el.querySelector('button').addEventListener('click',()=>fillForm(a));
        list.appendChild(el);
      });
    }

    $('createBtn').addEventListener('click', async()=>{ try{await createArticle();}catch(e){show('Création échouée: '+e.message,true);} });
    $('updateBtn').addEventListener('click', async()=>{ try{await updateArticle();}catch(e){show('Modification échouée: '+e.message,true);} });
    $('cancelEditBtn').addEventListener('click', ()=>{ clearForm(); setEditMode(false); show('Retour en mode création.'); });
    $('refreshBtn').addEventListener('click', async()=>{ try{await loadMeta(); await loadArticles(); show('Liste rafraîchie.');}catch(e){show('Erreur: '+e.message,true);} });
    $('articleId').addEventListener('input', ()=>{
      const hasId = Boolean($('articleId').value.trim());
      if(hasId && !isEditMode){
        setEditMode(true);
      }
      if(!hasId && isEditMode){
        setEditMode(false);
      }
    });

    (async()=>{ try{ setEditMode(false); await loadMeta(); await loadArticles(); } catch(e){ show('Erreur init: '+e.message,true); } })();
  </script>
</body>
</html>
